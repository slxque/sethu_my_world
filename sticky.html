<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Digital Diary</title>
    <link rel="stylesheet" href="sticky.css">
</head>
<body>

    <div class="action-buttons">
        <div class="note-btn" onclick="openNoteModal()">📝</div>
        <div class="note-btn" onclick="openGalleryModal()">📂</div>
    </div>

    <div id="gallery-modal" class="note-modal-overlay" onclick="closeGalleryModal()">
        <div class="gallery-card" onclick="event.stopPropagation()">
            <div class="gallery-header">
                <h3>Our Letters ❤️</h3>
                <span class="close-x" onclick="closeGalleryModal()">&times;</span>
            </div>

            <div id="notes-workspace" class="grid-container">
                </div>
        </div>
    </div>

    <div id="note-modal" class="note-modal-overlay" onclick="closeNoteModal()">
        <div class="note-card" onclick="event.stopPropagation()">
            <h3>Write a Note</h3>
            <textarea id="note-text" placeholder="Type your message..."></textarea>
            <div class="note-actions">
                <button class="cancel-btn" onclick="closeNoteModal()">Cancel</button>
                <button class="save-note-btn" onclick="saveStickyNote()">Save Note</button>
            </div>
        </div>
    </div>

    <div id="fullscreen-overlay" class="fullscreen-viewer" onclick="closeFullscreen()">
        <div class="fullscreen-card" onclick="event.stopPropagation()">
            <div class="washi-tape"></div>
            <div class="fullscreen-inner">
                <p id="fullscreen-content"></p>
            </div>
            <button class="back-btn" onclick="closeFullscreen()">Back to Gallery</button>
        </div>
    </div>

    <script>
        const workspace = document.getElementById('notes-workspace');
        
        function openNoteModal() { document.getElementById('note-modal').style.display = 'flex'; }
        function closeNoteModal() { 
            document.getElementById('note-modal').style.display = 'none'; 
            document.getElementById('note-text').value = ''; 
        }
        function openGalleryModal() { document.getElementById('gallery-modal').style.display = 'flex'; }
        function closeGalleryModal() { document.getElementById('gallery-modal').style.display = 'none'; }

        function openFullscreen(text) {
            document.getElementById('fullscreen-content').textContent = text;
            document.getElementById('fullscreen-overlay').style.display = 'flex';
        }

        function closeFullscreen() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
        }

        function saveStickyNote() {
            const text = document.getElementById('note-text').value.trim();
            if (!text) return;

            const note = document.createElement('div');
            note.className = 'sticky-note';
            
            // The preview paragraph
            const p = document.createElement('p');
            p.textContent = text;
            note.appendChild(p);
            
            // On click, it triggers the full screen view
            note.onclick = () => openFullscreen(text);

            workspace.appendChild(note);
            closeNoteModal();
            openGalleryModal();
        }
    </script>
</body>
</html>
