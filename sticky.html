<div class="action-buttons">
    <div class="note-btn" onclick="openNoteModal()" title="Write a Note">📝</div>
</div>

<div id="sticky-pile-container" class="note-pile" onclick="openNoteGrid()" style="display: none;">
</div>

<div id="note-grid-modal" class="note-modal-overlay" onclick="closeNoteGrid()">
    <div class="close-x" onclick="closeNoteGrid()">&times;</div>
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="sticky-grid" class="gallery-grid">
        </div>
    </div>
</div>

<div id="note-viewer-overlay" class="note-modal-overlay" onclick="closeNoteViewer()">
    <div class="close-x" style="top: 20px; left: 20px; right: auto;" onclick="closeNoteViewer()">&times;</div>
    <div id="full-note-content" class="full-note-view" onclick="event.stopPropagation()">
    </div>
</div>

<div id="note-modal" class="note-modal-overlay" onclick="closeNoteModal()">
    <div class="note-card" onclick="event.stopPropagation()">
        <div class="note-header">
            <h3>For My World ❤️</h3>
            <p>Write a poem, letter, or a sweet thought...</p>
        </div>

        <textarea id="note-text" placeholder="Start typing here..."></textarea>

        <div class="note-actions">
            <button class="cancel-btn" onclick="closeNoteModal()">Cancel</button>
            <button class="save-note-btn" onclick="saveStickyNote()">Stick it! ✨</button>
        </div>
    </div>
</div>
