<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffb6c1">

    <title>Our Digital Diary 📖✨</title>

    <link rel="icon" type="image/png" href="icon.png.png">
    <link rel="apple-touch-icon" href="icon.png.png">

    <link rel="stylesheet" href="diary-style.css">
    <link rel="stylesheet" href="sticky.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

<div class="top-nav">
    <div class="back-btn" onclick="window.location.href='index.html'">⬅️ Back</div>
    <div class="header-right">
        <div class="calendar-btn" onclick="window.location.href='calendar.html'" title="Open Calendar">📅</div>
        <div class="add-btn" onclick="triggerUpload(event)">+</div>
    </div>
</div>

<div class="book-container">
    <div id="diary-container" class="writing-surface">
        <div id="placeholder-text" class="placeholder">Loading memories...</div>
    </div>
</div>

<div class="sticky-icon" onclick="openNoteModal()">📝</div>

<div id="note-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 class="modal-title">Write a Note</h3>
        <textarea id="note-text" placeholder="What's on your mind?"></textarea>
        <div class="modal-actions">
            <button class="cancel-btn" onclick="closeNoteModal()">Cancel</button>
            <button class="save-btn" onclick="saveStickyNote()">Save</button>
        </div>
    </div>
</div>

<div class="diary-nav">
    <div class="nav-arrow" onclick="changeDay(-1)">⬅️</div>
    <div id="current-nav-date" class="nav-date">Today</div>
    <div id="next-day" class="nav-arrow" onclick="changeDay(1)">➡️</div>
</div>

<input type="file" id="file-input" accept="image/*,video/*" multiple onchange="handleUpload(event)">

<script src="script.js"></script>

</body>
</html>
