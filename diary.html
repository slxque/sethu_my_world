<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffb6c1">

    <title>Our Digital Diary 📖✨</title>

    <link rel="icon" type="image/png" href="icon.png.png">
    <link rel="apple-touch-icon" href="icon.png.png">

    <link rel="stylesheet" href="diary-style.css">
    <link rel="stylesheet" href="sticky.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>
<body>

<div class="top-nav">
    <div class="back-btn" onclick="window.location.href='index.html'">⬅️ Back</div>
    <div class="header-right">
        <div class="calendar-btn" onclick="window.location.href='calendar.html'" title="Open Calendar">📅</div>
        <div class="add-btn" onclick="triggerUpload(event)">+</div>
    </div>
</div>

<div class="action-buttons">
    <div class="note-btn" onclick="openNoteModal()" title="Write a Note">📝</div>
</div>

<div class="book-container">
    <div id="diary-container" class="writing-surface">
        <div id="placeholder-text" class="placeholder">Loading memories...</div>
    </div>
</div>

<div id="note-modal" class="note-modal-overlay" onclick="closeNoteModal()">
    <div class="note-card" onclick="event.stopPropagation()">
        <div class="note-header">
            <h3>For My World ❤️</h3>
            <p>Write a poem, letter, or a sweet thought...</p>
        </div>

        <textarea id="note-text" placeholder="Start typing here..."></textarea>

        <div class="note-actions">
            <button class="cancel-btn" onclick="closeNoteModal()">Cancel</button>
            <button class="save-note-btn" onclick="saveStickyNote()">Stick it! ✨</button>
        </div>
    </div>
</div>

<div id="gallery-modal" class="note-modal-overlay" onclick="closeGallery()">
    <div class="gallery-card" onclick="event.stopPropagation()">
        <div class="gallery-header">
            <h3 id="gallery-title">Memories</h3>
            <span class="close-gallery" onclick="closeGallery()">&times;</span>
        </div>
        <div id="gallery-grid" class="grid-container">
            </div>
    </div>
</div>

<div id="fullscreen-viewer" class="fullscreen-overlay" onclick="closeFullscreen()">
    <div class="fullscreen-content">
        <img id="fullscreen-img" src="" style="display: none;">
        <video id="fullscreen-vid" controls style="display: none;"></video>
        <div id="fullscreen-caption" class="polaroid-footer"></div>
    </div>
</div>

<div class="diary-nav">
    <div class="nav-arrow" id="prev-day" onclick="changeDay(-1)">⬅️</div>
    <div id="current-nav-date" class="nav-date">Today</div>
    <div class="nav-arrow" id="next-day" onclick="changeDay(1)">➡️</div>
</div>

<input type="file" id="file-input" style="display: none;" accept="image/*,video/*" multiple onchange="handleUpload(event)">

<script src="script.js"></script>

</body>
</html>
